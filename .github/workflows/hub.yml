# Lookout Hub image: tested on every push, published to ghcr.io/rogersquare/lookout-hub for
# x86-64 and 64-bit ARM (Raspberry Pi, ARM NAS boxes).
#   main        -> :edge
#   tag v1.2.3  -> :1.2.3, :1.2, :latest, plus a GitHub release with the install files
name: Hub

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["hub/**", "install/**", ".github/workflows/hub.yml"]
  pull_request:
    paths: ["hub/**", "install/**", ".github/workflows/hub.yml"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (x86-64)
        uses: docker/build-push-action@v6
        with:
          context: hub
          load: true
          tags: lookout-hub:test
          build-args: LOOKOUT_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The suites that need recorded camera footage run on the maintainer's hub instead
      - name: Tests
        run: |
          for t in test_pairing test_setup test_ptz test_streams_health test_detect; do
            docker run --rm --network host -v "$PWD/hub:/app" -w /app lookout-hub:test python "tests/$t.py"
          done
      - name: Installer syntax
        run: sh -n install/install.sh

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rogersquare/lookout-hub
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Lookout Hub
            org.opencontainers.image.description=Person alerts and live cameras for the Lookout iPhone and Apple Watch apps
            org.opencontainers.image.licenses=MIT
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: LOOKOUT_VERSION=${{ startsWith(github.ref, 'refs/tags/') && steps.v.outputs.version || 'edge' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release with the install files
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Lookout Hub $GITHUB_REF_NAME" --generate-notes \
            install/install.sh install/install.ps1 install/compose.yml install/compose.desktop.yml
